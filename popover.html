<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Roll Board</title>
<style>
:root{--ink:#e3e9e4;--muted:#98a59d;--accent:#e07a62;--accent-ink:#1a0f0b}
:root[data-theme="light"]{--ink:#1d2420;--muted:#5b6862;--accent:#8a2e1e;--accent-ink:#fff8f2}
html,body{margin:0;background:transparent;color:var(--ink);font:13px/1.4 system-ui,"Segoe UI",sans-serif}
main{padding:10px 14px;display:flex;flex-direction:column;gap:8px}
p{margin:0;color:var(--muted)}
button{font:600 14px system-ui,sans-serif;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:4px;padding:7px 12px;cursor:pointer}
</style>
<script src="obr-sdk.js"></script>
</head>
<body>
<main>
  <button type="button" id="open">Open the roll board</button>
  <p id="note"></p>
</main>
<script>
// Clicking the toolbar icon tries to open the board straight away, as a panel on the right
// that leaves the left side free for the dice tray. The button is a fallback.
const KEY="rodeo.haranshire.rollboard/";
const note=t=>document.getElementById("note").textContent=t;
function errText(e){try{return (e&&(e.message||(e.error&&e.error.message)))||JSON.stringify(e)}catch(_){return String(e)}}
async function openPanel(fromClick){
  try{
    const vw=await OBR.viewport.getWidth(), vh=await OBR.viewport.getHeight();
    const gap=Math.min(430,Math.round(vw*0.36));
    await OBR.popover.open({id:KEY+"panel",url:new URL("board.html?mode=panel&v=1.5",location.href).href,
      width:Math.max(600,vw-gap-16),height:Math.max(400,vh-76),
      anchorReference:"POSITION",anchorPosition:{left:vw-8,top:64},
      anchorOrigin:{horizontal:"RIGHT",vertical:"TOP"},transformOrigin:{horizontal:"RIGHT",vertical:"TOP"},
      disableClickAway:true,marginThreshold:8});
    OBR.action.close();
  }catch(e){ if(fromClick) note("Couldn’t open: "+errText(e)); }   // the automatic try fails quietly; the button is the fallback
}
document.getElementById("open").onclick=()=>{note("");if(window.OBR&&OBR.isAvailable)openPanel(true)};
if(window.OBR&&OBR.isAvailable){OBR.onReady(async()=>{
  try{const t=await OBR.theme.getTheme();document.documentElement.dataset.theme=t.mode==="DARK"?"dark":"light"}catch(_){}
  setTimeout(()=>openPanel(false),300);
})} else note("Open this from inside Owlbear Rodeo.");
</script>
</body>
</html>
