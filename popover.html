<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Roll Board</title>
<style>
html,body{margin:0;background:transparent;color:#98a59d;font:13px/1.4 system-ui,"Segoe UI",sans-serif}
p{margin:0;padding:10px 14px}
</style>
<script src="obr-sdk.js"></script>
</head>
<body>
<p>Opening the roll board…</p>
<script>
// Clicking the toolbar icon opens the board straight away as a panel on the right,
// leaving the left side of the screen free for the dice tray.
const KEY="rodeo.haranshire.rollboard/";
if(window.OBR&&OBR.isAvailable){OBR.onReady(async()=>{
  const vw=await OBR.viewport.getWidth(), vh=await OBR.viewport.getHeight();
  const gap=Math.min(430,Math.round(vw*0.36));
  await OBR.popover.open({id:KEY+"panel",url:new URL("board.html",location.href).href+"?mode=panel",
    width:Math.max(600,vw-gap-16),height:Math.max(400,vh-76),
    anchorReference:"POSITION",anchorPosition:{left:vw-8,top:64},
    anchorOrigin:{horizontal:"RIGHT",vertical:"TOP"},transformOrigin:{horizontal:"RIGHT",vertical:"TOP"},
    disableClickAway:true,marginThreshold:8});
  OBR.action.close();
})}
</script>
</body>
</html>
