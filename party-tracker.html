<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Party Tracker</title>
<style>
:root{--blue:#1d4f91;--deep:#143a6c;--ink:#1b1b1b;--muted:#5b6068;--rule:#c4c8ce;--soft:#dde0e5;--page:#fff;--panel:#f1f3f6;--hi:#eaf1fb;--good:#2e7d32;--warn:#b26a00;--bad:#b3261e;
--head:"Franklin Gothic Medium","Franklin Gothic","Arial Narrow","Segoe UI Semibold","Trebuchet MS",Arial,sans-serif;
--body:"Palatino Linotype","Book Antiqua",Palatino,Georgia,serif;--ui:"Segoe UI",Tahoma,Verdana,Arial,sans-serif;color-scheme:light}
*{box-sizing:border-box}html{font-size:17px}
body{margin:0;background:var(--page);color:var(--ink);font-family:var(--body);line-height:1.45}
header{background:var(--blue);color:#fff;padding:0 24px;display:flex;flex-wrap:wrap;align-items:flex-end;gap:6px 28px;border-bottom:4px solid #000}
header h1{font-family:var(--head);font-weight:500;font-size:1.35rem;margin:7px 0 6px;line-height:1.1}
header h1 small{display:inline;font:italic .78rem var(--body);opacity:.9;margin-left:10px}
nav{display:flex;gap:4px}nav[hidden]{display:none}nav button{font:.95rem var(--head);background:var(--deep);color:#dbe6f5;border:0;padding:6px 16px 5px;border-radius:3px 3px 0 0;cursor:pointer}
nav button[aria-selected=true]{background:#fff;color:var(--ink)}
main{padding:10px 20px 24px;max-width:1440px}
h2{font-family:var(--head);font-weight:500;font-size:1.3rem;margin:0 0 10px;color:var(--deep)}
h3{font-family:var(--head);font-weight:500;font-size:1.05rem;margin:0 0 6px;color:var(--deep)}
.hint{font:.84rem var(--ui);color:var(--muted)}
.btn{font:1rem var(--head);background:var(--blue);color:#fff;border:1px solid var(--deep);padding:8px 14px;border-radius:3px;cursor:pointer}
.btn:hover{background:var(--deep)}.btn.sec{background:#fff;color:var(--deep)}.btn.sec:hover{background:var(--hi)}.btn.small{font-size:.88rem;padding:4px 10px}
.btn.armed{background:var(--bad);border-color:var(--bad);color:#fff}
.link{border:0;background:none;padding:0;color:var(--blue);text-decoration:underline;cursor:pointer;font:600 .9rem var(--ui)}
label{display:block;font:600 .72rem var(--ui);letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
input,select,textarea{font:1rem var(--body);color:var(--ink);background:#fff;border:1px solid #8a919c;border-radius:3px;padding:5px 7px;width:100%}
input:disabled,textarea:disabled{background:var(--panel);border-color:var(--soft);color:var(--ink);-webkit-text-fill-color:var(--ink)}
textarea{min-height:90px;resize:vertical;line-height:1.4}
.card{border:1px solid var(--rule);border-top:4px solid var(--blue);padding:12px 14px;background:#fff}
.grid{display:grid;gap:10px 14px}
/* my characters */
.mylist{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px;align-items:center}
.mylist .pick{font:.95rem var(--head);border:1px solid var(--deep);background:#fff;color:var(--deep);border-radius:16px;padding:3px 13px;cursor:pointer}
.mylist .pick[aria-pressed=true]{background:var(--deep);color:#fff}
/* sheet */
.sheet{display:grid;gap:14px}
.ident{grid-template-columns:2.2fr 1.4fr 1fr 1.3fr .7fr 1.2fr 1fr}
.ident .nm input{font:1.25rem var(--head)}
.fight{grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.stat{background:var(--panel);border-left:3px solid var(--blue);padding:8px 10px}
.stat input{font:700 1.4rem var(--ui);text-align:center;padding:3px}
.saves{grid-template-columns:repeat(5,minmax(0,1fr))}
.abil{grid-template-columns:repeat(6,minmax(0,1fr))}
.saves input,.abil input{text-align:center;font:700 1.15rem var(--ui)}
.strx{display:flex;gap:4px;align-items:center}.strx span{font:700 1.1rem var(--ui)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
table.rows{width:100%;border-collapse:collapse}
table.rows th{font:600 .7rem var(--ui);letter-spacing:.04em;text-transform:uppercase;color:var(--muted);text-align:left;padding:2px 4px}
table.rows td{padding:2px 3px}table.rows input{padding:4px 6px}
.x{border:0;background:none;color:var(--muted);font-size:1.05rem;cursor:pointer;padding:2px 6px}
.money{grid-template-columns:repeat(5,minmax(0,1fr))}.money input{text-align:center;font:600 1rem var(--ui)}
.foot{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between}
.foot label.tick{display:flex;gap:6px;align-items:center;text-transform:none;letter-spacing:0;font:.9rem var(--ui);color:var(--ink)}.foot label.tick input{width:auto}
#status{font:.82rem var(--ui);color:var(--muted);min-height:1.2em}
#status.err{color:var(--bad);font-weight:600}
/* party */
.party{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.pc h3{margin:0;font-size:1.2rem;cursor:pointer}.pc h3:hover{text-decoration:underline}
.pc .sub{font:.85rem var(--ui);color:var(--muted);margin-bottom:8px}
.pcrow{display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap}
.big{font:700 1.6rem var(--ui);line-height:1}.big small{font-size:.95rem;color:var(--muted);font-weight:600}
.k{display:block;font:600 .66rem var(--ui);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.pc .line{font:.85rem var(--ui);margin-top:6px}
/* setup */
.setup{max-width:820px}.setup ol{padding-left:22px}.setup li{margin-bottom:14px}
.setup pre{background:var(--panel);border-left:3px solid var(--blue);padding:10px 12px;font:.8rem/1.4 Consolas,Menlo,monospace;white-space:pre-wrap;overflow-wrap:anywhere}
.setup code{font:.88rem Consolas,Menlo,monospace;background:var(--panel);padding:0 3px}
.demo{background:#fff6dc;border:1px solid #e3c770;padding:3px 10px;font:.8rem var(--ui);margin-bottom:8px}
@media(max-width:900px){.ident{grid-template-columns:1fr 1fr 1fr}.ident .nm{grid-column:1/-1}.fight{grid-template-columns:1fr 1fr}.two{grid-template-columns:1fr}}
@media(max-width:560px){main{padding:14px}header{padding:0 14px}.ident{grid-template-columns:1fr 1fr}.saves{grid-template-columns:repeat(2,minmax(0,1fr))}.abil{grid-template-columns:repeat(3,minmax(0,1fr))}.money{grid-template-columns:repeat(3,minmax(0,1fr))}}
.lockbar{margin-bottom:8px;padding:4px 10px!important;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;background:#fff6dc;border:1px solid #e3c770;padding:8px 12px;font:.9rem var(--ui)}
.share{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:22px;padding-top:12px;border-top:1px solid var(--soft)}
.share input{max-width:520px;font:.85rem Consolas,Menlo,monospace}
.ilist{margin:2px 0 0;padding-left:18px}.ilist li{margin:1px 0}.gear{white-space:pre-wrap;max-height:9em;overflow:auto;margin-top:2px}
.tick{display:flex;gap:6px;align-items:center;font:.9rem var(--ui)}
.tag{font:600 .62rem var(--ui);letter-spacing:.06em;text-transform:uppercase;background:var(--soft);color:var(--muted);border-radius:3px;padding:1px 5px;vertical-align:middle}
.bin{flex-direction:column;align-items:flex-start}.binrow{display:flex;gap:8px;align-items:center}.tick input{width:auto}

/* record sheet look, sized to fit a laptop screen */
.rs{display:block}.rsbox{border:2px solid var(--ink);background:#fff}
.rsbar{background:var(--ink);color:#fff;font:600 .7rem var(--head);letter-spacing:.14em;text-transform:uppercase;padding:2px 8px;display:flex;justify-content:space-between;gap:8px}
.barnote{font:400 .62rem var(--ui);letter-spacing:0;text-transform:none;opacity:.75}
.rsin{padding:6px 8px}
.rshead{display:grid;grid-template-columns:2.2fr 1fr 1fr 1.2fr .45fr 1.1fr 1fr;gap:14px;padding:4px 12px 5px;margin-bottom:8px}
.uf{display:flex;flex-direction:column}.uf input{border:0;border-bottom:1.5px solid var(--ink);border-radius:0;padding:1px 2px;background:transparent;font:1rem var(--body)}
.uf.wide input{font:1.2rem var(--head)}
.uf label,.cb label,.sv label{font:600 .58rem var(--ui);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:1px 0 0}
.uf input:focus,.cb input:focus,.abs input:focus,.sv input:focus{outline:2px solid var(--blue);outline-offset:1px}
.rsgrid{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(250px,.8fr) minmax(0,1fr);gap:8px;align-items:stretch}
.rscol{display:flex;flex-direction:column;gap:8px}.rsbox.fill{flex:1;display:flex;flex-direction:column}.rsbox.fill .rsin{flex:1;display:flex}.rsbox.fill textarea{flex:1;min-height:64px}
.ab{display:grid;grid-template-columns:96px auto minmax(0,1fr);gap:8px;align-items:center;padding:4px 8px;border-bottom:1px solid var(--rule);min-height:46px}.ab:last-child{border-bottom:0}
.abn{font:600 .72rem var(--head);letter-spacing:.07em;text-transform:uppercase}
.abs{display:flex;align-items:center;gap:2px;min-width:86px}.abs input{width:42px;height:38px;border:2px solid var(--ink);border-radius:0;text-align:center;font:700 1.2rem var(--ui);padding:0}
.abs input.strx{width:38px;height:28px;font-size:.9rem;border-width:1.5px}#strslash{font:700 1rem var(--ui)}
.abadj{font:600 .8rem/1.35 var(--ui);display:flex;flex-wrap:wrap;gap:0 12px}.abadj .a{white-space:nowrap}.abadj i{font-style:normal;font-weight:400;color:var(--muted);font-size:.72rem}
.cbs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;padding:6px 8px}
.cb{display:flex;flex-direction:column;align-items:center}.cb input{width:100%;height:40px;border:2px solid var(--ink);border-radius:0;text-align:center;font:700 1.3rem var(--ui);padding:0}
.cb.shield input{border-radius:0 0 50% 50% / 0 0 40% 40%;height:44px}
.cb label{text-align:center;line-height:1.2}
.cb.sm input{height:30px;font:600 .95rem var(--ui)}
.svs{padding:2px 8px 4px}.sv{display:grid;grid-template-columns:minmax(0,1fr) 46px;gap:8px;align-items:center;padding:2px 0;border-bottom:1px solid var(--rule)}.sv:last-child{border-bottom:0}
.sv label{font-size:.62rem;color:var(--ink);margin:0}.sv input{height:25px;border:2px solid var(--ink);border-radius:0;text-align:center;font:700 1rem var(--ui);padding:0}
.coins{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px}
#worth{margin:4px 0 0;font-size:.72rem}
.rs .foot{margin-top:6px}.rs .foot .btn.small{padding:2px 9px}
.rs input:disabled,.rs textarea:disabled{background:transparent}
@media(max-width:1100px){.rsgrid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.rsgrid>.rsbox{grid-column:1/-1}.rshead{grid-template-columns:2fr 1fr 1fr 1fr;row-gap:6px}}
@media(max-width:640px){.rsbox.fill textarea{min-height:110px}.rsgrid{grid-template-columns:1fr}.rshead{grid-template-columns:1fr 1fr}.rshead .wide{grid-column:1/-1}.ab{grid-template-columns:1fr auto}.ab .abadj{grid-column:1/-1}.coins{grid-template-columns:repeat(5,minmax(0,1fr))}}

/* back of the sheet, and the side switch */
.pgtabs{margin-left:auto;display:flex;gap:8px;align-items:center}
.seg2{display:inline-flex;border:1px solid var(--deep);border-radius:3px;overflow:hidden}.seg2 button{border:0;background:#fff;color:var(--deep);padding:3px 14px;font:.92rem var(--head);cursor:pointer}.seg2 button[aria-pressed=true]{background:var(--deep);color:#fff}
.rsgrid.back{grid-template-columns:repeat(3,minmax(0,1fr));min-height:430px}
.rsbox.tall{flex:2}
.ths{display:grid;grid-template-columns:1fr 1fr;gap:0 14px;padding:2px 8px 4px}.ths .sv{grid-template-columns:minmax(0,1fr) 46px}
.slots{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:4px;padding:6px 8px}
.pv{display:none}
.backhead{display:none}.rspage[data-page="back"]{margin-top:10px}
@media(max-width:1100px){.rsgrid.back{grid-template-columns:1fr 1fr}}
@media(max-width:640px){.rsgrid.back{grid-template-columns:1fr}.slots{grid-template-columns:repeat(5,minmax(0,1fr))}.pgtabs{margin-left:0}}
/* printing: both sides, one sheet of paper each, landscape */
@page{size:landscape;margin:9mm}
@media print{
  body{font-size:15px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  header,.mylist,.lockbar,.demo,.foot,.hint#status{display:none!important}
  main{padding:0;max-width:none}
  .backhead{display:block}.rspage[data-page="back"]{margin-top:0}
  .rspage{display:block!important;break-after:page}.rspage:last-of-type{break-after:auto}
  .rshead{grid-template-columns:2.2fr 1fr 1fr 1.2fr .45fr 1.1fr 1fr!important}
  .rsgrid{grid-template-columns:minmax(0,1.45fr) minmax(0,.8fr) minmax(0,1fr)!important;min-height:600px}
  .rsgrid.back{grid-template-columns:repeat(3,minmax(0,1fr))!important;min-height:600px!important}
  .rsgrid>.rsbox{grid-column:auto!important}
  textarea{display:none!important}.pv{display:block;white-space:pre-wrap;font:.9rem/1.35 var(--body);min-height:3em}
  input::placeholder{color:transparent}
  .barnote{color:#fff}
}
</style>
<script src="tracker-config.js"></script>
</head><body>
<header><h1>Party Tracker<small>Advanced Dungeons &amp; Dragons, 2nd Edition</small></h1>
<nav id="nav" hidden><button data-v="mine" aria-selected="true">My characters</button><button data-v="party" aria-selected="false">Party</button></nav>
</header>
<main id="main"><p class="hint">Loading…</p></main>
<script type="module">
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const LS={get:(k,d)=>{ try{ const v=localStorage.getItem(k); return v===null?d:JSON.parse(v); }catch(e){ return d; } }, set:(k,v)=>{ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }};
const CFG=window.TRACKER_CONFIG||null;
const DEMO=new URLSearchParams(location.search).has("demo");
const SAVES=[["sv1","Paralyzation, poison, death magic"],["sv2","Rod, staff or wand"],["sv3","Petrification or polymorph"],["sv4","Breath weapon"],["sv5","Spell"]];
const ABIL=[["str","Str"],["dex","Dex"],["con","Con"],["int","Int"],["wis","Wis"],["cha","Cha"]];
const COINS=["pp","gp","ep","sp","cp"];
const BLANK=()=>({name:"",player:"",race:"",cls:"",level:"1",align:"",xp:"",hpmax:"",ac:"10",thac0:"20",move:"12",
  sv1:"",sv2:"",sv3:"",sv4:"",sv5:"",str:"",strx:"",dex:"",con:"",int:"",wis:"",cha:"",magic:"",gear:"",notes:"",pp:"",gp:"",ep:"",sp:"",cp:"",hidden:false});
// ---------- the party's private code: from the link, else remembered by this browser ----------
const codeOk=c=>/^[A-Za-z0-9]{16,40}$/.test(c||"");
let PARTY=null;
(()=>{ const m=location.hash.match(/party=([A-Za-z0-9]+)/); if(m&&codeOk(m[1])){ PARTY=m[1]; LS.set("pt-party",PARTY); } else { const r=LS.get("pt-party",null); if(codeOk(r)) PARTY=r; } if(DEMO) PARTY="demo0000000000000000"; })();
const partyLink=()=>location.href.replace(/[?#].*$/,"")+"#party="+PARTY;
const newCode=()=>{ const A="ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789", r=new Uint32Array(22); crypto.getRandomValues(r); return [...r].map(x=>A[x%A.length]).join(""); };
// ---------- storage: Firebase, or this browser in demo mode ----------
async function firebaseApi(cfg,party){
  const B="https://www.gstatic.com/firebasejs/10.12.2/";
  const [{initializeApp},F]=await Promise.all([import(B+"firebase-app.js"),import(B+"firebase-firestore.js")]);
  const db=F.getFirestore(initializeApp(cfg.firebase)), col=F.collection(db,"parties",party,"characters"), ref=id=>F.doc(db,"parties",party,"characters",id);
  return { listen:(fn,err)=>F.onSnapshot(col,s=>fn(s.docs.map(d=>({id:d.id,...d.data()}))),err),
    create:data=>F.addDoc(col,data).then(r=>r.id), update:(id,p)=>F.updateDoc(ref(id),p), remove:id=>F.deleteDoc(ref(id)) };
}
function demoApi(){
  const KEY="party-tracker-demo5"; let all=LS.get(KEY,null);
  if(!all){ all={}; const s=o=>Object.assign(BLANK(),o);
    all.d1=s({name:"Brother Aldric",player:"Sam",race:"Human",cls:"Cleric",level:"3",align:"Lawful good",hpmax:"19",ac:"3",thac0:"20",move:"9",sv1:"9",sv2:"13",sv3:"12",sv4:"15",sv5:"14",str:"14",dex:"9",con:"13",int:"10",wis:"16",cha:"12",xp:"4,210",gp:"112",sp:"40",cp:"15",magic:"Mace +1\nPotion of Healing (1 dose)",nwp:"Healing (Wis −2)\nReligion (Wis +0)\nReading/writing (Int +1)",langs:"Common\nDwarvish",special:"Turn undead\nMay use only bludgeoning weapons",sl1:"4",sl2:"3",spells:"1st: Cure Light Wounds ×2, Bless, Command\n2nd: Hold Person, Spiritual Hammer, Slow Poison",gear:"Mace +1 (see magic items), chain mail, shield, holy symbol (silver), backpack, 3 days rations, 50 ft. rope, 2 torches"});
    all.d2=s({name:"Tamsin Reed",player:"Jo",race:"Halfling",cls:"Thief",level:"4",align:"Neutral",hpmax:"16",ac:"5",thac0:"19",move:"6",sv1:"9",sv2:"10",sv3:"11",sv4:"14",sv5:"11",str:"10",dex:"17",con:"15",int:"13",wis:"11",cha:"10",xp:"6,050",pp:"3",gp:"48",ep:"6",magic:"Ring of Protection +1\nWand of Magic Missiles (23 charges), found in the crypt",nwp:"Tumbling (Dex +0)\nJumping (Str +0)\nAppraising (Int +0)",langs:"Common\nHalfling\nGnomish",special:"Infravision 30 ft.\n+3 to hit with slings and thrown weapons\nBackstab ×2",th1:"45",th2:"40",th3:"30",th4:"50",th5:"45",th6:"25",th7:"60",th8:"10",gear:"Leather armor, short sword, sling and 20 bullets, thieves’ picks and tools, dark cloak"}); }
  let L=null; const save=()=>LS.set(KEY,all), fire=()=>setTimeout(()=>L&&L(Object.entries(all).map(([id,c])=>({id,...JSON.parse(JSON.stringify(c))}))),30);
  return { listen:fn=>{ L=fn; fire(); return ()=>{L=null;}; }, create:async d=>{ const id="c"+Date.now(); all[id]=d; save(); fire(); return id; },
    update:async(id,p)=>{ Object.assign(all[id],p); save(); fire(); }, remove:async id=>{ delete all[id]; save(); fire(); }, isDemo:true };
}
// ---------- app state ----------
let api=null, chars=[], view="mine", openId=null;
const MKEY=()=>"pt-mine-"+PARTY; let mine=new Set(LS.get(MKEY(),[])); const saveMine=()=>LS.set(MKEY(),[...mine]);
const unlocked=new Set();
const pending={}; let timer=null;
const canEdit=c=>!!c&&(mine.has(c.id)||unlocked.has(c.id));
const num=v=>{ const n=parseInt(String(v).replace(/[^\d-]/g,""),10); return isNaN(n)?null:n; };
const status=(t,err)=>{ const s=$("#status"); if(s){ s.textContent=t; s.className=err?"err":""; } };
function failMsg(e){ const c=e&&e.code||""; return c.includes("permission")?"Not saved: the database refused (check the rules from setup step 3).":c.includes("unavailable")?"Not saved yet: no connection. It will go through when you are back online.":"Not saved: "+(e&&e.message||e); }
function queue(id,patch){ pending[id]=Object.assign(pending[id]||{},patch); const c=chars.find(x=>x.id===id); if(c) Object.assign(c,patch); status("Saving…"); clearTimeout(timer); timer=setTimeout(flush,600); }
async function flush(){ for(const id of Object.keys(pending)){ const p=pending[id]; delete pending[id]; try{ await api.update(id,Object.assign(p,{updated:Date.now()})); status("Saved."); }catch(e){ status(failMsg(e),true); } } }
window.addEventListener("beforeunload",ev=>{ if(Object.keys(pending).length){ flush(); ev.preventDefault(); ev.returnValue=""; } });
$("#nav").addEventListener("click",ev=>{ const b=ev.target.closest("button[data-v]"); if(!b) return; setView(b.dataset.v); draw(); });
const setView=v=>{ view=v; $$("#nav button").forEach(x=>x.setAttribute("aria-selected",x.dataset.v===v)); };
// ---------- screens ----------
function draw(){ const m=$("#main"); if(!api) return;
  if(view==="party"){ m.innerHTML=demoNote()+partyHTML(); return; }
  const my=chars.filter(c=>mine.has(c.id)&&!c.binned).sort((a,b)=>(a.name||"").localeCompare(b.name||""));
  let c=chars.find(x=>x.id===openId&&!x.binned); if(!c&&my.length===1){ c=my[0]; openId=c.id; } if(!c&&openId) openId=null;
  const picks=my.map(x=>`<button class="pick" data-open="${esc(x.id)}" aria-pressed="${x.id===openId}">${esc(x.name||"Unnamed")}</button>`).join("");
  const lock=c&&!mine.has(c.id)?`<div class="lockbar"><span>This is <b>${esc(c.player||"another player")}</b>’s character${canEdit(c)?". You are editing it.":", so it is view only."}</span>${canEdit(c)?"":`<button class="btn sec small" id="unlock">Edit it anyway</button>`}<button class="btn sec small" id="claim">It’s mine: remember it on this device</button></div>`:"";
  const empty=my.length?"<p>Pick a character above.</p>":`<p>No characters on this device yet. Press <b>New character</b> to make one.</p><p class="hint">Made your character on another device? Open the <b>Party</b> tab, click its name, and press “It’s mine”.</p>`;
  const pg=c?`<span class="pgtabs"><button class="btn sec small" id="print">Print</button></span>`:"";
  m.innerHTML=demoNote()+`<div class="mylist">${picks}<button class="btn sec small" id="new">＋ New character</button>${pg}</div>`+(c?lock+sheetHTML(c):empty);
  if(c) fillSheet(c,true); m.querySelectorAll("input:not([type=checkbox]),textarea").forEach(x=>x.setAttribute("autocomplete","off")); }

<p class="hint">What they say: anyone with your party’s private link can see and change that party’s sheets, and nobody can list the parties. Firebase may email you that your rules are not secure, because no sign-in is required. That is expected; the private link is the lock.</p></li>
<li><b>Copy the project’s settings.</b> Open the gear icon, <i>Project settings</i>. Under <i>Your apps</i> press the web button (<code>&lt;/&gt;</code>), give it any nickname and register it (no hosting needed). Copy the block that starts <code>const firebaseConfig = {</code> and paste it here:<br>
<textarea id="su-cfg" placeholder="const firebaseConfig = { apiKey: &quot;…&quot;, … };" style="font:.85rem Consolas,Menlo,monospace;margin-top:6px"></textarea>
<button class="btn" id="su-make" style="margin-top:8px">Make tracker-config.js</button> <span class="hint" id="su-msg"></span>
<p class="hint">These settings are not secret: they only say which project to use.</p></li>
<li><b>Put both files on GitHub.</b> In your repository press <i>Add file</i>, <i>Upload files</i>, and upload this page (<code>party-tracker.html</code>) together with the <code>tracker-config.js</code> you just saved, then commit. If GitHub Pages is not on yet, open the repository’s <i>Settings</i>, <i>Pages</i>, choose <i>Deploy from a branch</i>, pick <i>main</i> and <i>/ (root)</i>, and save.</li>
<li><b>Start the party.</b> Open the page at its web address, for example <code>https://yourname.github.io/your-repo/party-tracker.html</code>, and press <i>Start a new party</i>. Make a test character, then copy the party link from the bottom of the <i>Party</i> tab and send it to your players.</li>
</ol></div>`; }
function parseCfg(t){ const o={}; for(const k of ["apiKey","authDomain","projectId","storageBucket","messagingSenderId","appId"]){ const m=t.match(new RegExp(k+`\\s*:\\s*["'\`]([^"'\`]+)["'\`]`)); if(m) o[k]=m[1]; } return o; }
function startSetup(){ $("#main").innerHTML=setupHTML(); const r=$("#su-rules"); r.textContent=RULES;
  $("#su-copy").addEventListener("click",async()=>{ try{ await navigator.clipboard.writeText(RULES); $("#su-copy").textContent="Copied ✓"; }catch(e){ const s=document.createRange(); s.selectNodeContents(r); getSelection().removeAllRanges(); getSelection().addRange(s); $("#su-copy").textContent="Selected: press Ctrl+C"; } });
  $("#su-make").addEventListener("click",()=>{ const msg=$("#su-msg"), c=parseCfg($("#su-cfg").value);
    if(!c.apiKey||!c.projectId||!c.appId){ msg.textContent="That does not look like the firebaseConfig block: it needs at least apiKey, projectId and appId."; msg.style.color="var(--bad)"; return; }
    const js="// Party Tracker settings, made by the setup page.\nwindow.TRACKER_CONFIG = "+JSON.stringify({firebase:c},null,2)+";\n";
    const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([js],{type:"text/javascript"})); a.download="tracker-config.js"; document.body.appendChild(a); a.click(); a.remove();
    msg.style.color=""; msg.textContent="Saved tracker-config.js to your downloads. On to step 5."; }); }
// ---------- start ----------
let unsub=null;
async function boot(){
  if(!CFG&&!DEMO){ startSetup(); return; }
  if(!PARTY){ $("#main").innerHTML=startHTML(); return; }
  $("#nav").hidden=false; $("#main").innerHTML=`<p class="hint">Loading the party…</p>`;
  try{ api=DEMO?demoApi():await firebaseApi(CFG,PARTY); }catch(e){ $("#main").innerHTML=`<div class="card"><h2>Could not reach the database</h2><p>${esc(e&&e.message||e)}</p><p class="hint">Check your internet connection and reload.</p></div>`; return; }
  if(unsub) unsub(); let first=true;
  unsub=api.listen(list=>{ list.forEach(c=>{ if(pending[c.id]) Object.assign(c,pending[c.id]); if(!c.magic&&Array.isArray(c.items)&&c.items.length) c.magic=c.items.filter(i=>i&&i.n).map(i=>i.n+(i.ch?` (${i.ch})`:"")+(i.note?` – ${i.note}`:"")).join("\n"); }); chars=list;
    const sh=$("#sheet"); if(!first&&view==="mine"&&sh&&chars.some(c=>c.id===sh.dataset.id)){ fillSheet(chars.find(c=>c.id===sh.dataset.id),false); return; }
    first=false; draw(); }, e=>{ $("#main").innerHTML=`<div class="card"><h2>The database said no</h2><p>${esc(e&&e.message||e)}</p><p class="hint">Usually the rules from setup step 3 are missing or were not published.</p></div>`; });
}
boot();
</script></body></html>
