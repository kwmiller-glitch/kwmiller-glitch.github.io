<!doctype html><html><head><meta charset="utf-8"><title>THAC0 Helper</title>
<style>
:root{--bg:#222639;--paper:#2b2f45;--text:#fff;--muted:rgba(255,255,255,.7);--line:rgba(255,255,255,.14);--accent:#bb99ff;--good:#66bb6a}
*{box-sizing:border-box}html,body{margin:0;background:transparent;color:var(--text);font:14px/1.4 "Segoe UI",Roboto,Helvetica,Arial,sans-serif}
main{padding:12px 14px}
h1{font-size:16px;margin:0 0 8px}h2{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
.hint{color:var(--muted);font-size:12.5px;margin:4px 0}
.switch{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:transparent;color:var(--text);font:600 15px inherit;font-family:inherit;cursor:pointer}
.switch .pill{width:46px;height:26px;border-radius:13px;background:rgba(255,255,255,.25);position:relative;flex:none;transition:background .15s}
.switch .pill::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s}
.switch[aria-pressed=true] .pill{background:var(--good)}.switch[aria-pressed=true] .pill::after{left:23px}
.row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.row .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.row.away .nm{color:var(--muted)}
.row input{width:62px;padding:4px 6px;border-radius:6px;border:1px solid var(--line);background:rgba(0,0,0,.25);color:var(--text);font:600 15px inherit;font-family:inherit;text-align:center}
.bl{border:1px solid var(--line);border-radius:12px;padding:1px 8px;background:transparent;color:var(--muted);font:12px inherit;font-family:inherit;cursor:pointer;flex:none}
.bl[aria-pressed=true]{background:#e0b84f;border-color:#e0b84f;color:#222;font-weight:700}
.h2b{display:flex;align-items:center;gap:6px}.h2b h2{flex:1}.h2b button{border:1px solid var(--line);border-radius:6px;background:transparent;color:var(--text);font:12px inherit;font-family:inherit;padding:2px 8px;cursor:pointer;margin-top:8px}
.cb{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-top:10px}
.cb .top{display:flex;align-items:center;gap:8px}.cb .rd{flex:1;font-weight:700;font-size:15px}
.cb button{border:1px solid var(--line);border-radius:6px;background:transparent;color:var(--text);font:13px inherit;font-family:inherit;padding:3px 9px;cursor:pointer}
.cb .start{width:100%;padding:6px;font-weight:600}
.seg{display:flex;margin-top:7px;border:1px solid var(--line);border-radius:8px;overflow:hidden}.seg button{flex:1;border:0;border-radius:0;padding:6px 4px;font-weight:600}
.seg button+button{border-left:1px solid var(--line)}.seg button[aria-pressed=true].pt{background:#43a047;color:#fff}.seg button[aria-pressed=true].mo{background:#e53935;color:#fff}
.cb button:disabled{opacity:.35;cursor:default}
.step{margin:8px 0 0;font-size:13.5px}.step .tp{color:#81c784}.step .tm{color:#ef9a9a}
.cb .go{width:100%;margin-top:6px;padding:6px;font-weight:600;background:rgba(255,255,255,.08)}
.cb .end{color:var(--muted);border-color:transparent}.turnline{margin:6px 0 0;font-size:13px}
.nm.ren{cursor:pointer}.nm.ren:hover{text-decoration:underline dotted}
.renf{flex:1;display:flex;gap:4px;min-width:0}.renf input{flex:1;min-width:0;width:auto!important;text-align:left!important}.renf button{border:1px solid var(--line);border-radius:6px;background:transparent;color:var(--text);font:12px inherit;font-family:inherit;padding:2px 8px;cursor:pointer}
.now{font-style:normal;color:var(--muted);font-size:12px}
.x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:15px;padding:2px 4px}
.pc{border-bottom:1px solid var(--line);padding:6px 0 8px}.pc .row{border:0;padding:2px 0}
.ws{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
.w{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:14px;padding:2px 4px 2px 10px;background:transparent;color:var(--text);font:13px inherit;font-family:inherit;cursor:pointer}
.w[aria-pressed=true]{background:var(--good);border-color:var(--good);color:#fff}.w .b{opacity:.8;font-size:12px}.w.none{padding-right:10px}
.w .sp{font-size:10.5px;font-weight:700;letter-spacing:.04em;padding:0 5px;border-radius:4px;background:rgba(255,255,255,.2)}
.addf label{display:flex;align-items:center;gap:3px;font-size:12px;color:var(--muted);white-space:nowrap;cursor:pointer}.addf input[type=checkbox]{flex:none;width:auto;margin:0}
.w .wx{border:0;background:none;color:inherit;opacity:.7;cursor:pointer;font-size:12px;padding:0 4px}
.add{border:1px dashed var(--line);border-radius:14px;padding:2px 10px;background:transparent;color:var(--muted);font:13px inherit;font-family:inherit;cursor:pointer}
.addf{display:flex;gap:5px;margin-top:5px}.addf input{width:auto;flex:1;min-width:0;padding:4px 6px;border-radius:6px;border:1px solid var(--line);background:rgba(0,0,0,.25);color:var(--text);font:13px inherit;font-family:inherit}
.addf input.bn{flex:none;width:52px;text-align:center}.addf button{border:1px solid var(--line);border-radius:6px;background:var(--good);color:#fff;font:600 13px inherit;font-family:inherit;padding:3px 10px;cursor:pointer}
details.move{margin-top:12px}details.move summary{cursor:pointer;color:var(--muted);font-size:12.5px}
details.move textarea{width:100%;height:70px;margin-top:6px;border-radius:6px;border:1px solid var(--line);background:rgba(0,0,0,.25);color:var(--text);font:11px Consolas,monospace}
details.move button{margin-top:4px;border:1px solid var(--line);border-radius:6px;background:transparent;color:var(--text);padding:3px 10px;cursor:pointer;font-family:inherit}
.mine{margin:6px 0 0;font-size:13px}
.log{list-style:none;margin:0;padding:0}.log li{display:flex;gap:6px;padding:4px 0;border-bottom:1px solid var(--line);font-size:13px}
.log .ac{margin-left:auto;font-weight:700;white-space:nowrap}.log .n20 .ac{color:#ffd54f}.log .n1 .ac{color:#ff8a80}
.log .who{font-weight:600}.log .r{color:var(--muted)}
.state{display:inline-block;font-size:12px;font-weight:700;padding:1px 8px;border-radius:10px;background:rgba(255,255,255,.18)}.state.on{background:var(--good)}
</style></head><body><main id="app"><p class="hint">Loading…</p></main>
<script type="module">
import OBR from "./obr-sdk.js";
import { KEY, ID, readSettings, activeWeapon, acText, rollText, esc, LOG_KEY, blessLeft, turnText, nextRound, undo, canUndo, setFirst, stepTurn, other, canon } from "./shared.js?v=15";
const app = document.getElementById("app");
let role = "PLAYER", myName = "", myId = "", settings = { on: false, thac0: {}, weapons: {}, active: {}, bless: {}, round: 0, turn: "", first: "", hist: [] }, players = [], log = [], adding = null, renaming = null, moveMsg = "";
const saveSettings = (s) => OBR.room.setMetadata({ [KEY]: s });

function logHTML() {
  if (!log.length) return `<p class="hint">No attack rolls yet.</p>`;
  return `<ul class="log">${log.slice(0, 12).map((e) => `<li class="${e.nat === 20 ? "n20" : e.nat === 1 ? "n1" : ""}"><span class="who">${esc(e.name)}</span><span class="r">${esc(rollText(e))}</span><span class="ac">${esc(acText(e))}</span></li>`).join("")}</ul>`;
}
function draw() {
  const focus = document.activeElement && document.activeElement.dataset && document.activeElement.dataset.name;
  if (role !== "GM") {
    app.innerHTML = `<h1>THAC0 Helper <span class="state${settings.on ? " on" : ""}">${settings.on ? "ON" : "OFF"}</span></h1>
      <p class="hint">${settings.on ? "Your DM has switched this on: roll a d20 with the Dice and a banner at the top of the screen shows which Armor Class you hit." : "Your DM switches this on for attack rolls. While it’s on, your d20 rolls show which Armor Class you hit."}</p>
      ${(() => { const w = activeWeapon(settings, myName); return settings.thac0[myName] !== undefined ? `<p class="mine">Your THAC0: <b>${esc(settings.thac0[myName])}</b>${w ? ` · weapon: <b>${esc(w.n)}</b>${+w.b ? ` (${+w.b > 0 ? "+" : "−"}${Math.abs(+w.b)} to hit)` : ""}${w.s ? `, specialized (+1 to hit)` : ""}` : ""}${settings.bless[myName] ? ` · <b>blessed</b> (+1 to hit${blessLeft(settings, myName) !== null ? ", " + blessLeft(settings, myName) + " rd left" : ""})` : ""}</p>` : ""; })()}
      ${settings.round ? `<p class="turnline"><b>${esc(turnText(settings))}</b></p>` : ""}
      <h2>Recent rolls</h2>${logHTML()}`;
    return;
  }
  const present = players.filter((p) => p.role !== "GM"), here = present.map((p) => canon(settings, p));
  const nowAs = {}; present.forEach((p) => { const c = canon(settings, p); if (c !== p.name) nowAs[c] = p.name; });
  const names = [...new Set([...here, ...Object.keys(settings.thac0)])].sort((a, b) => a.localeCompare(b));
  app.innerHTML = `<h1>THAC0 Helper</h1>
    <button class="switch" id="sw" aria-pressed="${settings.on}"><span>AC calculator ${settings.on ? "on" : "off"}</span><span class="pill"></span></button>
    <p class="hint">${settings.on ? "Every d20 a player rolls now shows the Armor Class it hits. Switch it off for saving throws and checks." : "Off: d20s are left alone. Switch it on when the attacks start."}</p>
    <div class="cb">${settings.round ? `<div class="top"><button id="prevrd" title="Undo the last step"${canUndo(settings) ? "" : " disabled"}>◀</button><span class="rd">Round ${settings.round}</span><button id="nextrd" title="Skip straight to the next round">Next round</button><button class="end" id="endcb" title="Combat over: hide the round from everyone’s screen and clear Bless">End</button></div>
      ${(() => { const S = { party: "Party", monsters: "Monsters" }, t = settings.turn, f = settings.first;
        if (!t) return `<p class="step">Who won initiative?</p><div class="seg"><button class="pt" data-first="party">Party first</button><button class="mo" data-first="monsters">Monsters first</button></div>`;
        if (t === "over") return `<p class="step">${S[f] || "?"} went first, then ${S[other(f)]}. <b>Round over.</b></p><button class="go" id="nextrd2">Start round ${settings.round + 1}</button>`;
        const nth = t === f ? "1st" : "2nd";
        return `<p class="step"><b class="${t === "party" ? "tp" : "tm"}">${S[t]} act</b> (${nth})${t === f ? ` · ${S[other(f)]} next` : ` · ${S[f]} went first`}</p><button class="go" id="stepdone">${S[t]} done → ${t === f ? S[other(f)] : "round over"}</button>`; })()}`
      : `<button class="start" id="startcb">Start combat · round 1</button>`}</div>
    <div class="h2b"><h2>Players</h2>${names.some((n) => settings.thac0[n] !== undefined) ? `<button id="blessall" title="Bless: +1 to attack rolls">Bless all</button><button id="blessclear">Clear all</button>` : ""}</div>
    ${names.length ? names.map((n) => { const ws = settings.weapons[n] || [], act = settings.active[n]; const sel = Number.isInteger(act) && ws[act] ? act : -1;
      return `<div class="pc"><div class="row${here.includes(n) ? "" : " away"}">${renaming === n ? `<form class="renf" data-renform="${esc(n)}"><input name="nn" value="${esc(nowAs[n] || n)}" autocomplete="off" aria-label="New name for ${esc(n)}"><button>OK</button></form>` : `<span class="nm${settings.thac0[n] === undefined ? "" : " ren"}" ${settings.thac0[n] === undefined ? "" : `data-ren="${esc(n)}" `}title="${settings.thac0[n] === undefined ? esc(n) : "Click to rename " + esc(n)}">${esc(n)}${here.includes(n) ? "" : " (not here)"}</span>`}${settings.thac0[n] === undefined ? "" : `<button class="bl" data-bless="${esc(n)}" aria-pressed="${!!settings.bless[n]}" title="Bless: +1 to attack rolls">${settings.bless[n] ? "Blessed +1" + (blessLeft(settings, n) !== null ? " · " + blessLeft(settings, n) + " rd" : "") : "Bless"}</button>`}<input data-name="${esc(n)}" inputmode="numeric" placeholder="—" value="${settings.thac0[n] ?? ""}" aria-label="THAC0 for ${esc(n)}"><button class="x" data-del="${esc(n)}" title="Forget ${esc(n)}">✕</button></div>
      ${settings.thac0[n] === undefined ? "" : `<div class="ws"><button class="w none" data-pick="${esc(n)}" data-i="-1" aria-pressed="${sel === -1}" title="Use the plain THAC0">None</button>${ws.map((w, i) => `<span class="w" role="button" tabindex="0" data-pick="${esc(n)}" data-i="${i}" aria-pressed="${sel === i}">${esc(w.n)} ${w.s ? `<span class="sp" title="Specialized: +1 to hit">SPEC</span>` : ""}<span class="b">${+w.b > 0 ? "+" : +w.b < 0 ? "−" : ""}${Math.abs(+w.b) || 0}</span><button class="wx" data-wdel="${esc(n)}" data-i="${i}" title="Remove ${esc(w.n)}">✕</button></span>`).join("")}<button class="add" data-addfor="${esc(n)}">+ weapon</button></div>`}
      ${adding === n ? `<form class="addf" data-addform="${esc(n)}"><input name="wn" placeholder="Weapon, e.g. Long sword +1" autocomplete="off" required><input name="wb" class="bn" placeholder="+1" inputmode="numeric" autocomplete="off" title="Bonus to hit (include Strength or Dexterity if you like)"><label title="Weapon specialization: +1 to hit with this weapon. For bows and crossbows, use the Dice’s +/− button instead."><input type="checkbox" name="ws">Spec.</label><button>Add</button></form>` : ""}</div>`; }).join("") : `<p class="hint">No players in the room yet.</p>`}
    <details class="move"><summary>Move these THAC0s and weapons to another room</summary><p class="hint">Copy this text, open the new room’s THAC0 Helper, paste it in the same box there and press Load.</p><textarea id="mv">${esc(JSON.stringify({ thac0: settings.thac0, weapons: settings.weapons }))}</textarea><button id="mvload">Load</button> <span class="hint">${esc(moveMsg)}</span></details>`;
  if (focus) { const el = app.querySelector(`input[data-name="${CSS.escape(focus)}"]`); if (el) { el.focus(); const v = el.value; el.value = ""; el.value = v; } }
}
app.addEventListener("click", (ev) => {
  const sw = ev.target.closest("#sw"); if (sw) { settings.on = !settings.on; draw(); saveSettings(settings); return; }
  const bl = ev.target.closest("[data-bless]"); if (bl) { const n = bl.dataset.bless; if (settings.bless[n]) delete settings.bless[n]; else settings.bless[n] = settings.round || true; draw(); saveSettings(settings); return; }
  if (ev.target.id === "blessall") { const here = players.filter((p) => p.role !== "GM").map((p) => canon(settings, p)); const ns = Object.keys(settings.thac0).filter((n) => here.includes(n)); (ns.length ? ns : Object.keys(settings.thac0)).forEach((n) => (settings.bless[n] = settings.round || true)); draw(); saveSettings(settings); return; }
  if (ev.target.id === "startcb") { settings.round = 1; settings.turn = ""; settings.first = ""; settings.hist = []; for (const n in settings.bless) if (settings.bless[n] === true) settings.bless[n] = 1; draw(); saveSettings(settings); return; }
  if (ev.target.id === "nextrd" || ev.target.id === "nextrd2") { nextRound(settings); draw(); saveSettings(settings); return; }
  if (ev.target.id === "prevrd") { undo(settings); draw(); saveSettings(settings); return; }
  if (ev.target.id === "stepdone") { stepTurn(settings); draw(); saveSettings(settings); return; }
  const fb = ev.target.closest("[data-first]"); if (fb) { setFirst(settings, fb.dataset.first); draw(); saveSettings(settings); return; }
  if (ev.target.id === "endcb") { settings.round = 0; settings.turn = ""; settings.first = ""; settings.hist = []; settings.bless = {}; draw(); saveSettings(settings); return; }
  if (ev.target.id === "blessclear") { settings.bless = {}; draw(); saveSettings(settings); return; }
  const del = ev.target.closest("[data-del]"); if (del) { const n = del.dataset.del; delete settings.thac0[n]; delete settings.weapons[n]; delete settings.active[n]; delete settings.bless[n];
    for (const id in settings.ids) if (settings.ids[id] === n) delete settings.ids[id]; draw(); saveSettings(settings); return; }
  const wd = ev.target.closest("[data-wdel]"); if (wd) { ev.stopPropagation(); const n = wd.dataset.wdel, i = +wd.dataset.i, ws = settings.weapons[n] || []; ws.splice(i, 1); settings.weapons[n] = ws;
    const a = settings.active[n]; if (Number.isInteger(a)) { if (a === i) delete settings.active[n]; else if (a > i) settings.active[n] = a - 1; } draw(); saveSettings(settings); return; }
  const pk = ev.target.closest("[data-pick]"); if (pk) { const n = pk.dataset.pick, i = +pk.dataset.i; if (i < 0) delete settings.active[n]; else settings.active[n] = i; draw(); saveSettings(settings); return; }
  const rn = ev.target.closest("[data-ren]"); if (rn) { renaming = rn.dataset.ren; draw(); const i = app.querySelector(".renf input"); if (i) { i.focus(); i.select(); } return; }
  const ad = ev.target.closest("[data-addfor]"); if (ad) { adding = adding === ad.dataset.addfor ? null : ad.dataset.addfor; draw(); const f = app.querySelector(".addf input"); if (f) f.focus(); return; }
  if (ev.target.id === "mvload") { try { const o = JSON.parse(app.querySelector("#mv").value); if (!o || typeof o !== "object" || typeof o.thac0 !== "object") throw 0;
      settings.thac0 = Object.assign({}, settings.thac0, o.thac0); settings.weapons = Object.assign({}, settings.weapons, o.weapons || {}); moveMsg = "Loaded."; saveSettings(settings); } catch (e) { moveMsg = "That text isn’t a THAC0 Helper list."; } draw(); }
});
app.addEventListener("keydown", (ev) => { const pk = ev.target.closest && ev.target.closest("span[data-pick]"); if (pk && (ev.key === "Enter" || ev.key === " ")) { ev.preventDefault(); pk.click(); } });
// Renaming a character moves everything saved under the old name (THAC0, weapons, Bless, the Owlbear link) to the new one.
app.addEventListener("submit", (ev) => { const f = ev.target.closest("[data-renform]"); if (!f) return; ev.preventDefault();
  const old = f.dataset.renform, nn = f.nn.value.trim().slice(0, 40); renaming = null;
  if (!nn || nn === old || settings.thac0[nn] !== undefined) { draw(); return; }
  const mv = (o) => { if (o && Object.prototype.hasOwnProperty.call(o, old)) { o[nn] = o[old]; delete o[old]; } };
  mv(settings.thac0); mv(settings.weapons); mv(settings.active); mv(settings.bless);
  (settings.hist || []).forEach((h) => mv(h.bless));
  for (const id in settings.ids) if (settings.ids[id] === old) settings.ids[id] = nn;
  draw(); saveSettings(settings);
});
app.addEventListener("keydown", (ev) => { if (ev.key === "Escape" && renaming !== null) { renaming = null; draw(); } });
app.addEventListener("submit", (ev) => { const f = ev.target.closest("[data-addform]"); if (!f) return; ev.preventDefault(); const n = f.dataset.addform, wn = f.wn.value.trim(); if (!wn) return;
  const b = parseInt(String(f.wb.value).replace(/[^\d-]/g, ""), 10) || 0; (settings.weapons[n] = settings.weapons[n] || []).push(f.ws.checked ? { n: wn, b, s: true } : { n: wn, b }); settings.active[n] = settings.weapons[n].length - 1; adding = null; draw(); saveSettings(settings); });
app.addEventListener("change", (ev) => {
  const el = ev.target; if (!el.dataset.name) return;
  const v = el.value.trim(); if (v === "") delete settings.thac0[el.dataset.name];
  else { const n = parseInt(v, 10); if (isNaN(n)) { el.value = settings.thac0[el.dataset.name] ?? ""; return; } settings.thac0[el.dataset.name] = n; el.value = n; }
  saveSettings(settings);
});
new BroadcastChannel(ID + "/log").onmessage = (m) => { log = m.data || []; draw(); };
OBR.onReady(async () => {
  try { const t = await OBR.theme.getTheme(); const r = document.documentElement.style; r.setProperty("--text", t.text.primary); r.setProperty("--muted", t.text.secondary); r.setProperty("--accent", t.primary.main); } catch (e) {}
  role = await OBR.player.getRole(); myName = await OBR.player.getName(); myId = await OBR.player.getId();
  try { log = JSON.parse(localStorage.getItem(LOG_KEY(OBR.room.id)) || "[]"); } catch (e) {}
  settings = readSettings(await OBR.room.getMetadata());
  players = await OBR.party.getPlayers();
  draw();
  OBR.room.onMetadataChange((meta) => { settings = readSettings(meta); const a = document.activeElement; if (!(a && ((a.dataset && a.dataset.name) || a.closest(".addf") || a.id === "mv"))) draw(); });
  OBR.party.onChange((ps) => { players = ps; draw(); });
  OBR.player.onChange((p) => { if ((p.role && p.role !== role) || (p.name && p.name !== myName)) { role = p.role || role; myName = p.name || myName; draw(); } });
});
</script></body></html>
