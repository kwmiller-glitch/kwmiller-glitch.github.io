<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>THAC0 Helper</title>
<style>body{margin:0;font:16px/1.5 "Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:#222639;color:#fff}main{max-width:620px;margin:0 auto;padding:32px 20px}h1{font-size:1.6rem;margin:0 0 8px}code{background:rgba(255,255,255,.12);padding:2px 6px;border-radius:4px;word-break:break-all}p{color:rgba(255,255,255,.85)}</style></head>
<body><main><h1>THAC0 Helper</h1>
<p>An Owlbear Rodeo extension for AD&amp;D 2nd Edition. When the DM switches it on, every d20 rolled with Owlbear’s Dice shows which Armor Class it hits.</p>
<p>To add it to Owlbear Rodeo: open your profile, choose <b>Add Extension</b>, and paste this address:</p>
<p><code id="m"></code></p>
<script>document.getElementById("m").textContent=location.origin+"/thac0-helper/manifest.json";</script>
</main></body></html>
