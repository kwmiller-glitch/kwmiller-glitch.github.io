<!doctype html><html><head><meta charset="utf-8"><title>Combat turn</title>
<style>
html,body{margin:0;background:transparent;overflow:hidden;font-family:"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.p{margin:4px auto;width:max-content;max-width:calc(100% - 8px);box-sizing:border-box;display:flex;align-items:center;gap:2px;padding:2px 10px;border-radius:16px;background:rgba(24,26,33,.94);color:#fff;font-size:15px;font-weight:700;line-height:24px;white-space:nowrap;box-shadow:0 3px 12px rgba(0,0,0,.4);border:2px solid #8a90a0}
.p.party{border-color:#66bb6a}.p.monsters{border-color:#ef5350}.r{color:#c9ced8;font-weight:600}.p.over{color:#c9ced8}
.gm span[data-act]{cursor:pointer;border-radius:8px;padding:0 4px}.gm span[data-act]:hover{background:rgba(255,255,255,.14)}
.back{color:#c9ced8;font-size:12px}.ch{color:#fff}.ch.pt{color:#a5d6a7}.ch.mo{color:#ef9a9a}.or{color:#8a90a0;font-weight:400;padding:0 2px}
</style></head><body><div class="p" id="p"></div>
<script type="module">
import OBR from "./obr-sdk.js";
import { KEY, readSettings, nextRound, undo, setFirst, stepTurn, turnWords, esc } from "./shared.js?v=9";
let s = {}; try { s = JSON.parse(decodeURIComponent(location.hash.slice(1))); } catch (e) {}
const t = turnWords(s);
const p = document.getElementById("p"); p.className = "p " + (s.turn || "");
p.innerHTML = `<span class="r">Round ${esc(s.round || "")} ·</span> <span>${t}</span>`;
// Only the DM can click. The words move the round on one step at a time:
// Roll initiative → (pick who won) → winners act → the other side acts → Round over → next round.
// Clicking "Round 3" skips straight to the next round; ◀ undoes the last step.
OBR.onReady(async () => {
  if ((await OBR.player.getRole()) !== "GM") return;
  p.classList.add("gm");
  const back = s.canUndo ? `<span data-act="undo" class="back" title="Undo the last step">◀</span>` : "";
  const rd = `<span data-act="next" class="r" title="Skip to the next round">Round ${esc(s.round || "")} ·</span>`;
  const draw = (choosing) => {
    p.innerHTML = back + rd + (choosing
      ? `<span data-act="party" class="ch pt" title="The party won initiative">Party</span><span class="or">or</span><span data-act="monsters" class="ch mo" title="The monsters won initiative">Monsters</span><span class="or">first?</span>`
      : `<span data-act="${!s.turn ? "choose" : s.turn === "over" ? "next" : "step"}" title="${!s.turn ? "Click, then pick who won initiative" : s.turn === "over" ? "Click to start the next round" : "Click when this side is done"}">${t}</span>`);
  };
  draw(false);
  p.addEventListener("click", async (ev) => {
    const a = ev.target.closest("[data-act]"); if (!a) return;
    if (a.dataset.act === "choose") { draw(true); return; }
    const st = readSettings(await OBR.room.getMetadata()); if (!st.round) return;
    const act = a.dataset.act;
    if (act === "next") nextRound(st); else if (act === "undo") undo(st); else if (act === "step") stepTurn(st); else setFirst(st, act);
    await OBR.room.setMetadata({ [KEY]: st });
  });
});
</script></body></html>
